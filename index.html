<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f2" />

    <title>Gavin Eugenio | Portfolio</title>
    <meta name="description" content="Gavin Eugenio's personal portfolio." />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <script>
      // Apply the saved theme before the page renders.
      try {
        const savedTheme = localStorage.getItem('theme')

        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme
        }
      } catch {
        // Continue using the system preference if storage is unavailable.
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
