# Run automated checks to verify code quality and build integrity.
name: CI

# Trigger the workflow when pushing to main or opening a pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Run the job on the latest Ubuntu runner.
    runs-on: ubuntu-latest

    steps:
      # Check out the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js and enable npm dependency caching.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependencies using the committed lockfile.
      - name: Install dependencies
        run: npm ci

      # Run formatting, linting, and production build checks.
      - name: Run checks
        run: npm run check
